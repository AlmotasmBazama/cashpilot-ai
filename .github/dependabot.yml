version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directories:
      - /
      - /services/cashpilot_ai_gateway
      - /services/cashpilot_account_deletion
      - /tools/groq_evaluation
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
